<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ashish M | Home</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #171a23;
      --text: #eaeaea;
      --muted: #9aa0ac;
      --accent: #5b8cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 40px;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }
    p.tagline {
      color: var(--muted);
      margin: 0 0 24px;
      font-size: 1.05rem;
    }
    .links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .links a {
      color: var(--accent);
      text-decoration: none;
      border: 1px solid var(--accent);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      transition: background 0.2s, color 0.2s;
    }
    .links a:hover {
      background: var(--accent);
      color: #fff;
    }
    section h2 {
      font-size: 1.1rem;
      margin-bottom: 8px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    ul.projects {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    ul.projects li {
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    ul.projects li:last-child { border-bottom: none; }
    ul.projects a {
      color: var(--text);
      font-weight: 600;
      text-decoration: none;
    }
    ul.projects a:hover { color: var(--accent); }
    ul.projects .desc {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }
    footer {
      margin-top: 32px;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hi, I'm Ashish 👋</h1>
    <p class="tagline">Add a short line here about who you are or what you do.</p>

    <div class="links">
      <a href="mailto:you@example.com">Email</a>
      <a href="https://github.com/ashish-m-proj" target="_blank">GitHub</a>
      <a href="https://linkedin.com/in/yourprofile" target="_blank">LinkedIn</a>
    </div>

    <section>
      <h2>Projects</h2>
      <ul class="projects">
        <li>
          <a href="#" target="_blank">Project One</a>
          <div class="desc">One-line description of what it does.</div>
        </li>
        <li>
          <a href="#" target="_blank">Project Two</a>
          <div class="desc">One-line description of what it does.</div>
        </li>
      </ul>
    </section>

    <footer>&copy; 2026 Ashish M. Built with GitHub Pages.</footer>
  </div>
</body>
</html>
